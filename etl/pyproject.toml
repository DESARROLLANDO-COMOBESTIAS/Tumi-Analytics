[project]
name = "tumi-etl"
version = "0.1.0"
description = "Pipeline ETL de Tumi Analytics (Open-Meteo + ExchangeRate)"
requires-python = ">=3.12"
dependencies = [
    "tumi-shared",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "boto3>=1.34",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
tumi-etl = "etl.pipeline:main"

[tool.setuptools.packages.find]
include = ["etl*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
