services:
  db:
    image: postgres:16-alpine
    container_name: tumi_postgres
    environment:
      POSTGRES_DB: tumi
      POSTGRES_USER: tumi
      POSTGRES_PASSWORD: tumi_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tumi -d tumi"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3.8.1
    container_name: tumi_localstack
    environment:
      SERVICES: s3
      DEBUG: 0
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack

volumes:
  pgdata:
  localstack_data:
