services:
  db:
    image: postgres:16-alpine
    container_name: tumi_postgres
    environment:
      POSTGRES_DB: tumi
      POSTGRES_USER: tumi
      POSTGRES_PASSWORD: tumi_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tumi -d tumi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
